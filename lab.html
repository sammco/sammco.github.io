<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연구중 | SAMMCO 삼코</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--w:#fff;--k:#111;--g3:#8a8a8a;--lav:#cdbcf5;--lav2:#a98bea}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#fff linear-gradient(#bba5ef 0,#dcd0f8 460px,#fff 900px) top/100% 900px no-repeat;color:var(--k);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
a{color:inherit}
::selection{background:var(--lav)}
:focus-visible{outline:3px solid var(--lav2);outline-offset:3px}
.cur{position:fixed;left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--k);border:2px solid #fff;pointer-events:none;z-index:99;transition:width .3s,height .3s,margin .3s,background .3s,opacity .3s,border-color .3s}
.cur.hov{width:70px;height:70px;margin:-35px 0 0 -35px;background:var(--lav);border-color:transparent;opacity:.75}
@media (hover:hover){body,a,button{cursor:none}}
@media (hover:none){.cur{display:none}}
nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 28px;z-index:10;background:rgba(255,255,255,.6);backdrop-filter:blur(10px);font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem}
nav a{text-decoration:none;margin-left:26px;padding:2px 10px;color:var(--k);transition:color .25s,text-shadow .25s}
nav a:first-child{margin-left:-10px}
nav a:hover,nav a:active,nav a:focus-visible{color:#fff;text-shadow:0 0 3px rgba(112,82,205,.95),0 1px 8px rgba(112,82,205,.85)}
.top{position:relative;overflow:hidden;text-align:center;padding:150px 20px 70px}
.cl{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);filter:blur(36px);pointer-events:none;animation:drift 38s ease-in-out infinite alternate}
.c1{width:34vw;height:12vw;left:-6vw;top:20%}
.c2{width:40vw;height:14vw;right:-8vw;top:50%;animation-duration:46s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translateX(9vw)}}
h1{position:relative;font-family:'Jua','Noto Sans KR',sans-serif;font-weight:600;font-size:clamp(3rem,10vw,7rem);line-height:1.1;letter-spacing:.04em;color:#fff;text-shadow:0 5px 0 rgba(150,120,225,.5),0 12px 26px rgba(112,82,205,.45),0 0 34px rgba(255,255,255,.8)}
.sub{position:relative;margin-top:14px;color:#3d3560}
.pill{display:inline-block;border:2px solid var(--k);border-radius:99px;padding:6px 26px;font-family:'Fredoka','Noto Sans KR',sans-serif;font-weight:600;text-decoration:none;transition:background .3s}
.pill:hover{background:var(--lav)}
.list{max-width:1100px;margin:0 auto;padding:10px 28px 6vh;display:grid;gap:56px}
.item{display:grid;grid-template-columns:1.15fr 1fr;gap:36px;align-items:center}
.item:nth-child(even){grid-template-columns:1fr 1.15fr}
.item:nth-child(even) .thumb{order:2}
.thumb{aspect-ratio:4/3;border-radius:32px;overflow:hidden;box-shadow:0 14px 40px rgba(112,82,205,.2);background:radial-gradient(circle at 28% 62%,#fff 0 17%,transparent 18%),radial-gradient(circle at 48% 50%,#fff 0 22%,transparent 23%),radial-gradient(circle at 70% 60%,#fff 0 17%,transparent 18%),linear-gradient(#cdbcf5,#e6dcfa);transition:transform .5s}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.item:hover .thumb{transform:scale(1.02)}
.item:hover .thumb img{transform:scale(1.06)}
.tag{display:inline-block;border:2px solid var(--k);border-radius:99px;padding:1px 16px;font-size:.85rem;font-weight:700}
.item h2{margin:14px 0 6px;font-size:clamp(1.5rem,3vw,2.2rem);letter-spacing:-.02em;line-height:1.25}
.item p{color:#555}
.item small{display:block;margin-top:14px;color:var(--g3)}
.item .pill{margin-top:18px}
@media(max-width:760px){.item,.item:nth-child(even){grid-template-columns:1fr}.item:nth-child(even) .thumb{order:0}}
footer{text-align:center;padding:6vh 28px 50px;color:var(--g3);font-size:.9rem}
footer a{display:inline-block;margin-bottom:10px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem;color:var(--k);text-decoration:none;padding:4px 14px;transition:color .25s,text-shadow .25s}
footer a:hover{color:var(--lav2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="cur" id="cur"></div>
<nav>
  <a href="index.html">SAMMCO</a>
  <div><a href="index.html">Home</a><a href="games.html">Web</a><a href="lab.html">Lab</a><span id="acct"></span></div>
</nav>
<header class="top">
  <div class="cl c1"></div><div class="cl c2"></div>
  <h1>연구중</h1>
  <p class="sub">개발 중인 게임들을 미리 만나보세요.</p>
</header>
<main class="list" id="labList">
  <!-- 플레이할 수 있는 연구중 게임은 games-data.js 에서 section:'lab' 으로 등록하면 이 위에 자동으로 나와요.
       아래는 직접 적는 소개용 칸이에요. 프로젝트 하나 = article 하나. 복사해서 이름, 소개만 바꾸세요. 자동으로 좌우가 번갈아 배치돼요.
       이미지를 넣으려면 <div class="thumb"></div> 안에 <img src="이미지파일.png" alt=""> 를 넣으세요. -->
  <article class="item">
    <div class="thumb"></div>
    <div><span class="tag">연구중</span><h2>프로젝트 이름</h2><p>연구 중인 게임에 대한 소개를 여기에 적어주세요.</p><small>2026 / 엔진, 장르 등</small></div>
  </article>
  <article class="item">
    <div class="thumb"></div>
    <div><span class="tag">연구중</span><h2>프로젝트 이름</h2><p>연구 중인 게임에 대한 소개를 여기에 적어주세요.</p><small>2026 / 엔진, 장르 등</small></div>
  </article>
  <article class="item">
    <div class="thumb"></div>
    <div><span class="tag">연구중</span><h2>프로젝트 이름</h2><p>연구 중인 게임에 대한 소개를 여기에 적어주세요.</p><small>2026 / 엔진, 장르 등</small></div>
  </article>
</main>
<footer><a href="index.html">SAMMCO 홈으로</a><br>© 2026 SAMMCO 삼코</footer>
<script src="games-data.js"></script>
<script src="player-config.js"></script>
<script src="sammco-account.js"></script>
<script>
(function(){
  /* games-data.js 에서 section:'lab' 인 게임을 맨 위에 카드로 넣어요 */
  var L=(window.SAMMCO_GAMES||[]).filter(function(g){return g.section==='lab'}),list=document.getElementById('labList');
  L.slice().reverse().forEach(function(g){
    var a=document.createElement('article');a.className='item';
    a.innerHTML='<div class="thumb"></div><div><span class="tag">연구중</span><h2></h2><p></p><small></small><a class="pill">PLAY</a></div>';
    a.querySelector('h2').textContent=g.title;
    a.querySelector('p').textContent=g.desc||'';
    var sm=a.querySelector('small');if(g.labNote)sm.textContent=g.labNote;else sm.remove();
    a.querySelector('.pill').href='play.html?g='+encodeURIComponent(g.id);
    if(g.thumb){var im=document.createElement('img');im.alt='';im.src=g.thumb;a.querySelector('.thumb').appendChild(im)}
    list.insertBefore(a,list.firstElementChild);
  });
})();
</script>
<script>
(function(){
  var cur=document.getElementById('cur');
  addEventListener('pointermove',function(e){if(e.pointerType==='mouse')cur.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)'});
  document.querySelectorAll('a').forEach(function(el){
    if(el.closest('nav'))return;
    el.addEventListener('mouseenter',function(){cur.classList.add('hov')});
    el.addEventListener('mouseleave',function(){cur.classList.remove('hov')});
  });
})();
</script>
</body>
</html>
