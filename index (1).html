<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>샘플 게임</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#d9ccf7;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#s{position:fixed;left:14px;top:10px;font:700 clamp(16px,3vw,26px) system-ui;color:#111}
</style>
</head>
<body>
<div id="s">0</div>
<canvas id="c"></canvas>
<script>
/* 틀 확인용 샘플: 올라오는 구름을 눌러서 터뜨려요 */
var c=document.getElementById('c'),g=c.getContext('2d'),sEl=document.getElementById('s'),W,H,P=[],score=0;
function fit(){W=c.width=innerWidth;H=c.height=innerHeight}
fit();addEventListener('resize',fit);
function add(){var r=H*(.05+Math.random()*.06);P.push({x:r+Math.random()*(W-2*r),y:H+r,r:r,v:H*(.0015+Math.random()*.003)})}
setInterval(add,450);
c.addEventListener('pointerdown',function(e){
  var b=c.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,y=(e.clientY-b.top)*H/b.height;
  for(var i=P.length-1;i>=0;i--){var p=P[i];if(Math.hypot(p.x-x,p.y-y)<p.r*1.15){P.splice(i,1);score++;sEl.textContent=score;break}}
});
(function loop(){
  g.clearRect(0,0,W,H);
  for(var i=P.length-1;i>=0;i--){var p=P[i];p.y-=p.v*16;if(p.y<-p.r){P.splice(i,1);continue}
    g.fillStyle='rgba(255,255,255,.92)';g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.arc(p.x-p.r*.8,p.y+p.r*.25,p.r*.7,0,6.283);g.arc(p.x+p.r*.8,p.y+p.r*.25,p.r*.7,0,6.283);g.fill()}
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
