<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>윷놀이</title>
<!-- SAMMCO 사이트용: 외부 글꼴 주소는 뺐어요(사이트 규칙). 글꼴 파일을 이 폴더에 넣으면 다시 쓸 수 있어요 -->
<script src="../../sammco-guard.js"></script>
<script src="sammco-bridge.js"></script>
<style>
/* 한지 위에 놓인 나전칠기 판. 모든 패널은 옻칠 바탕 + 자개 테두리. 무대는 화면 비율에 맞춰 늘어남 */
:root{
  --hanji:#0b1215; --hanji-deep:#1a2427; --paper:#151c1f; --ink:#ece4d2; --ink-soft:#a39a88;
  --bg0:#070b0d; --bg1:#0d171b; --bg2:#14242a; --sea:#4f8f88;
  --hong:#c4452f; --cheong:#2e5e8e; --hwang:#c9962a; --nok:#3f7d4f; --mat:#33467a; --line:#2f3a3d;
  --lq:#0f0c0a; --lq2:#1d1714; --pearl:#efe7d6; --pearl-soft:#b4a891; --gold:#cfb07a; --ju:#a3301f;
  --nacre:linear-gradient(118deg,#d4efe6,#eccfe2 22%,#cdd7f5 44%,#dcf3e9 64%,#f2e2c6 82%,#d4efe6);
  --display:"Song Myung","Nanum Myeongjo",serif; --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{margin:0;color:var(--ink);font-family:var(--body);overflow:hidden;
  background:radial-gradient(ellipse 70% 60% at 50% 42%,var(--bg2) 0%,var(--bg1) 45%,var(--bg0) 100%) fixed,var(--bg0);}
#ambient{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}
#fit{position:fixed;inset:0;overflow:hidden;}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;}
button{font-family:var(--body);cursor:pointer;color:var(--ink);}
/* 옻칠 패널: 검은 칠 바탕 + 자개 테두리. 안쪽은 밝은 글씨 토큰으로 바뀜 */
.lq{--ink:var(--pearl);--ink-soft:var(--pearl-soft);--paper:#1b1613;--hanji:#211b17;--hanji-deep:#2c241f;--line:#3b322b;
  color:var(--pearl);border:1.5px solid transparent;border-radius:12px;
  background:linear-gradient(160deg,var(--lq2),var(--lq) 60%) padding-box,var(--nacre) border-box;
  box-shadow:0 14px 30px rgba(43,32,22,.38),inset 0 1px 0 rgba(255,236,210,.07);}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--hwang);outline-offset:2px;}
.screen{position:absolute;inset:0;}
/* ---------- 로비 ---------- */
#lobby{display:grid;place-items:center;padding:48px 64px;box-sizing:border-box;overflow:auto;}
.port #lobby{padding:48px 40px;}
.lob-left{width:min(560px,100%);}
.lob-title{font-family:var(--display);font-size:84px;line-height:1.05;margin:0;letter-spacing:.06em;font-weight:400;}
.lob-title .tt{background:linear-gradient(100deg,#e9e1cf 0%,#e9e1cf 35%,#cfeee4 45%,#efd2e4 52%,#d3dbf6 58%,#e9e1cf 68%,#e9e1cf 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 6s ease-in-out infinite;}
@keyframes sheen{0%{background-position:100% 0}60%,100%{background-position:0 0}}
.lob-title::after{content:"";display:block;width:120px;height:3px;margin:18px auto 0;background:var(--nacre);border-radius:2px;}
.lob-title small{display:block;font-size:20px;color:var(--ink-soft);font-family:var(--body);margin-top:14px;letter-spacing:0;}
.lob-left{display:flex;flex-direction:column;gap:26px;align-items:center;text-align:center;}
.lob-left .mode-list{align-self:stretch;}
.lob-left .lob-sub{justify-content:center;}
.mode-list{display:flex;flex-direction:column;gap:12px;}
.mode-btn{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:16px;text-align:left;padding:16px 20px;transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s;}
.mode-btn:hover{transform:translateY(-3px);box-shadow:0 20px 36px rgba(43,32,22,.45),inset 0 1px 0 rgba(255,236,210,.1);}
.mode-btn b{font-family:var(--display);font-size:30px;font-weight:400;}
.mode-btn span{color:var(--pearl-soft);font-size:15px;line-height:1.5;}
.lob-sub{display:flex;gap:10px;flex-wrap:wrap;}
.chip-btn{background:rgba(255,240,220,.03);border:1px solid #3a4447;padding:9px 16px;border-radius:999px;font-size:15px;color:var(--ink);}
.chip-btn:hover{border-color:var(--gold);color:var(--pearl);}
.bokdon{font-size:16px;color:var(--ink-soft);}
.bokdon b{font-family:var(--display);font-size:24px;color:var(--ink);font-weight:400;margin:0 4px;}
.note{font-size:13px;color:var(--ink-soft);line-height:1.6;max-width:520px;}
/* ---------- 매칭 ---------- */
#match{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;}
#match h2{font-family:var(--display);font-size:44px;font-weight:400;margin:0;}
.slots{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;}
.port .slot{width:150px;}
.slot{width:170px;height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;}
.slot.wait{opacity:.6;color:var(--pearl-soft);}
.slot .nm{font-family:var(--display);font-size:22px;}
.slot .team{position:absolute;top:8px;left:10px;font-size:12px;padding:2px 8px;border-radius:999px;color:#1a1512;}
.ai-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--ink);color:var(--paper);padding:1px 6px;border-radius:3px;vertical-align:middle;margin-left:4px;font-family:var(--body);}
.timer-big{font-family:var(--display);font-size:56px;font-variant-numeric:tabular-nums;}
/* ---------- 게임: 판이 가운데, 정보는 아래 독, 자세한 건 펼침 서랍 ---------- */
#boardWrap{position:absolute;left:50%;top:var(--btop);width:var(--bs);height:var(--bs);margin-left:calc(var(--bs) / -2);perspective:1400px;}
#boardWrap::before{content:"";position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(closest-side,rgba(120,200,190,.13),rgba(120,200,190,0));animation:breathe 7s ease-in-out infinite;pointer-events:none;}
@keyframes breathe{50%{opacity:.55;transform:scale(1.04)}}
#boardTilt{position:absolute;inset:0;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-origin:50% 50%;transition:transform .4s cubic-bezier(.2,.7,.3,1);}
#boardCv{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 26px 30px rgba(0,0,0,.7)) drop-shadow(0 0 46px rgba(110,190,180,.16))}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;}
.g-top{position:absolute;top:14px;left:18px;right:18px;display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none;}
.g-top>*{pointer-events:auto;}
.g-round{font-family:var(--display);font-size:20px;color:var(--pearl-soft);letter-spacing:.03em;}
.g-tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.tool{background:var(--lq);color:var(--pearl);border:1px solid #3b322b;border-radius:999px;padding:6px 13px;font-size:12px;box-shadow:0 4px 10px rgba(43,32,22,.25);}
.tool:hover{border-color:var(--gold);}
.tool.on,.small-btn.on{background:var(--pearl);color:var(--lq);border-color:var(--pearl);}
.small-btn{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;}
.small-btn:hover{border-color:var(--gold);}
.small-btn:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line);}
#dock{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(1180px,calc(100% - 32px));height:var(--dh);box-sizing:border-box;
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;padding:10px 14px;align-items:center;z-index:6;}
.port #dock{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);}
.port .d-players{grid-column:1/-1;}
.d-players{display:grid;grid-template-columns:repeat(2,minmax(0,168px));gap:6px;}
.pm{display:grid;grid-template-columns:28px minmax(0,1fr);gap:7px;align-items:center;text-align:left;padding:4px 8px;border-radius:9px;border:1px solid transparent;background:rgba(255,240,220,.025);color:var(--pearl);}
.pm:hover{border-color:#4a3f35;}
.pm.turn{border-color:var(--gold);background:rgba(207,176,122,.09);}
.pm .nm{display:block;font-family:var(--display);font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pm .meta{display:block;font-size:11px;color:var(--pearl-soft);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.d-act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;min-width:0;}
.d-mid{display:flex;flex-direction:column;gap:6px;min-width:0;}
.who{font-family:var(--display);font-size:18px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;}
.tbar{width:80px;height:4px;background:#2c241f;border-radius:2px;overflow:hidden;flex:none;}
.tbar i{display:block;height:100%;background:var(--nacre);}
.d-btns{display:flex;flex-direction:column;gap:6px;align-items:stretch;}
.d-btns .row{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.d-menu{display:flex;flex-direction:column;gap:6px;}
.menu-btn{display:flex;justify-content:space-between;gap:12px;min-width:118px;background:rgba(255,240,220,.03);color:var(--pearl);border:1px solid #3b322b;border-radius:9px;padding:7px 12px;font-size:13px;}
.menu-btn b{font-weight:400;color:var(--gold);font-variant-numeric:tabular-nums;}
.menu-btn:hover,.menu-btn.on{border-color:var(--gold);}
.menu-btn.glow{box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(207,176,122,.35);}
.sticks{width:132px;height:76px;flex:none;overflow:visible;}
.sticks .stk{transform-box:fill-box;transform-origin:center;}
.sticks.tossing .stk{animation:toss .8s cubic-bezier(.25,.7,.45,1) both;}
.sticks.tossing .face{animation:flip .16s steps(1) infinite;}
.sticks.landed .stk{animation:land .35s ease-out both;}
@keyframes toss{0%{transform:translate(0,0) rotate(0)}45%{transform:translate(var(--x),-60px) rotate(calc(var(--r) * .55))}80%{transform:translate(0,5px) rotate(var(--r))}100%{transform:translate(0,0) rotate(var(--r))}}
@keyframes flip{0%{fill:#1a1310}50%{fill:#e9e2d4}}
@keyframes land{0%{transform:translateY(-12px)}55%{transform:translateY(2px)}100%{transform:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0;}
.rchip{min-width:46px;padding:5px 8px;border:1px solid #4a3f35;background:rgba(255,240,220,.04);color:var(--pearl);border-radius:8px;font-family:var(--display);font-size:19px;line-height:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.rchip small{font-family:var(--body);font-size:10px;color:var(--pearl-soft);}
.rchip[disabled]{cursor:default;opacity:1;}
.big-btn{background:linear-gradient(180deg,#b9392a,#7a1d14);color:#f8ecd8;border:1px solid var(--gold);border-radius:999px;padding:9px 22px;font-family:var(--display);font-size:19px;letter-spacing:.06em;
  box-shadow:inset 0 1px 0 rgba(255,222,190,.35),0 4px 12px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s;}
.big-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,222,190,.35),0 8px 18px rgba(122,29,20,.45);}
.big-btn:disabled{background:#2a221d;color:#75695b;border-color:#3b322b;box-shadow:none;cursor:not-allowed;}
.hint{font-size:12px;color:var(--pearl-soft);min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ai-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;background:var(--pearl-soft);color:#1a1512;padding:0 5px;border-radius:3px;vertical-align:middle;margin-left:4px;font-family:var(--body);}
.deb{font-size:10px;border:1px solid #c0503f;color:#e08070;border-radius:3px;padding:0 3px;margin-left:3px;}
.tg{font-size:10px;color:#fff;padding:1px 5px;border-radius:3px;line-height:1.35;}
.tg.off{opacity:.35;text-decoration:line-through;}
/* 펼침 서랍 */
#drawer{position:absolute;left:50%;bottom:calc(var(--dh) + 24px);width:min(660px,calc(100% - 32px));max-height:calc(100% - var(--dh) - 96px);overflow:auto;transform:translateX(-50%);padding:16px 18px;z-index:8;box-sizing:border-box;animation:drawerIn .38s cubic-bezier(.2,.8,.3,1);}
@keyframes drawerIn{from{opacity:0;transform:translate(-50%,26px) scale(.98)}to{opacity:1;transform:translateX(-50%)}}
#drawer h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 8px;display:flex;align-items:center;gap:10px;}
#drawer h3 small{font-family:var(--body);font-size:12px;color:var(--pearl-soft);}
#drawer h3 .x{margin-left:auto;}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pcard{background:rgba(255,240,220,.03);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:40px 1fr;gap:8px;position:relative;min-width:0;}
.pcard.turn{border-color:var(--gold);}
.pcard .nm{font-family:var(--display);font-size:18px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcard .meta{font-size:12px;color:var(--pearl-soft);margin-top:2px;font-variant-numeric:tabular-nums;}
.pcard .tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;min-height:16px;}
.mis{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:14px;padding:8px 0;border-top:1px solid var(--line);align-items:center;}
.mis .st{font-size:12px;color:var(--pearl-soft);white-space:nowrap;}
.mis.done .nmx{text-decoration:line-through;color:var(--pearl-soft);}
.aug{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:14px;padding:7px 0;border-top:1px solid var(--line);}
.aug small{color:var(--pearl-soft);}
.syn{font-size:12px;color:var(--pearl-soft);line-height:1.6;margin-top:8px;}
/* 윷 던지기 연출: 판 가운데 위로 크게 */
#throwFx{position:absolute;left:50%;top:calc(var(--btop) + var(--bs) * .46);transform:translate(-50%,-50%);pointer-events:none;z-index:7;display:flex;flex-direction:column;align-items:center;gap:4px;}
#yutFx{position:absolute;left:50%;top:var(--btop);width:var(--bs);height:var(--bs);margin-left:calc(var(--bs) / -2);pointer-events:none;z-index:7;}
#yutFx canvas{position:absolute;inset:-6%;width:112%;height:112%;}
#yutFx .fx-word{position:absolute;left:50%;top:6%;transform:translateX(-50%) scale(.5);}
#yutFx .fx-word.show{animation:wordIn2 .55s cubic-bezier(.2,1.4,.4,1) forwards;}
@keyframes wordIn2{to{opacity:1;transform:translateX(-50%) scale(1)}}
#yutFx.out{animation:fadeOut .45s ease-in forwards;}
@keyframes fadeOut{to{opacity:0}}
#throwFx .sticks{width:300px;height:172px;filter:drop-shadow(0 16px 20px rgba(0,0,0,.55));}
.fx-word{font-family:var(--display);font-size:92px;line-height:1;background:var(--nacre);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px rgba(0,0,0,.7));opacity:0;transform:scale(.5);}
.fx-word.show{animation:wordIn .55s cubic-bezier(.2,1.4,.4,1) forwards;}
@keyframes wordIn{to{opacity:1;transform:none}}
#throwFx.out{animation:fxOut .42s ease-in forwards;}
@keyframes fxOut{to{opacity:0;transform:translate(-50%,-62%) scale(.92)}}
/* 차례 알림 */
#turnBanner{position:absolute;left:50%;top:calc(var(--btop) + 18px);transform:translateX(-50%);padding:7px 26px;font-family:var(--display);font-size:20px;letter-spacing:.06em;z-index:6;pointer-events:none;animation:banner 1.4s ease forwards;white-space:nowrap;}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-14px)}14%,74%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
/* ---------- 모달 ---------- */
#modal{position:absolute;inset:0;background:rgba(24,18,14,.5);display:flex;align-items:center;justify-content:center;z-index:20;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0}}
.mbox{padding:24px 28px;max-width:min(880px,92%);max-height:88%;overflow:auto;box-sizing:border-box;animation:drawerIn2 .4s cubic-bezier(.2,.8,.3,1);}
@keyframes drawerIn2{from{opacity:0;transform:translateY(18px) scale(.98)}}
.mbox h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0 0 6px;}
.mbox p{margin:4px 0 12px;color:var(--pearl-soft);font-size:14px;line-height:1.6;}
.cards{display:flex;gap:14px;flex-wrap:wrap;}
.acard{width:230px;text-align:left;background:rgba(255,240,220,.035);color:var(--pearl);border:1px solid #4a3f35;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;transition:transform .2s cubic-bezier(.2,.8,.3,1),border-color .2s;}
.acard:hover{transform:translateY(-4px);border-color:var(--gold);}
.acard .kind{font-size:12px;display:flex;gap:6px;align-items:center;}
.acard b{font-family:var(--display);font-weight:400;font-size:24px;}
.acard span.d{font-size:14px;line-height:1.5;}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
table.rank{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums;}
table.rank th,table.rank td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;}
table.rank th:first-child,table.rank td:first-child,table.rank td:nth-child(2),table.rank th:nth-child(2){text-align:left;}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.dex .it{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;line-height:1.45;background:rgba(255,240,220,.03);}
.dex .it.lock{color:var(--ink-soft);background:transparent;border-style:dashed;}
.dex .it b{font-family:var(--display);font-weight:400;font-size:17px;display:block;}
.tabs{display:flex;gap:6px;margin:6px 0 12px;}
.tabs button.on{background:var(--ink);color:var(--paper);}
.skins{display:flex;gap:14px;flex-wrap:wrap;}
.skin{width:150px;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,240,220,.03);}
.skin svg{width:56px;height:88px;}
#rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--hanji);z-index:50;font-family:var(--display);font-size:22px;text-align:center;padding:24px;}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex;}}
.hit{cursor:pointer;}
#boardWrap.enter{animation:boardIn 1s cubic-bezier(.2,.8,.25,1) both;}
@keyframes boardIn{0%{opacity:0;transform:translateY(-60px) scale(.82) rotateX(38deg)}60%{opacity:1}100%{opacity:1;transform:none}}
/* 화면 전환: 옻칠 판이 비스듬히 덮었다가 걷히며, 자개 꽃 원문이 가운데서 돌아간다 */
#wipe{position:absolute;inset:0;z-index:40;pointer-events:none;overflow:hidden;}
#wipe .sheet{position:absolute;left:-60%;top:-60%;width:220%;height:220%;background:linear-gradient(135deg,#2a201b,#120d0b 45%,#070504);transform:rotate(-14deg) translateX(-105%);}
#wipe .sheet::before,#wipe .sheet::after{content:"";position:absolute;top:0;bottom:0;width:10px;background-image:var(--nacre);background-size:220px;box-shadow:0 0 18px rgba(220,240,255,.55);}
#wipe .sheet::before{left:0}#wipe .sheet::after{right:0}
#wipe .medal{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;opacity:0;transform:scale(.4) rotate(-90deg);}
#wipe.cover .sheet{animation:sheetIn .55s cubic-bezier(.7,0,.3,1) forwards;}
#wipe.cover .medal{animation:medalIn .5s .35s cubic-bezier(.2,.9,.3,1.2) forwards;}
#wipe.uncover .sheet{transform:rotate(-14deg) translateX(0);animation:sheetOut .6s cubic-bezier(.7,0,.3,1) forwards;}
#wipe.uncover .medal{opacity:1;transform:none;animation:medalOut .35s ease-in forwards;}
@keyframes sheetIn{to{transform:rotate(-14deg) translateX(0)}}
@keyframes sheetOut{to{transform:rotate(-14deg) translateX(105%)}}
@keyframes medalIn{to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes medalOut{to{opacity:0;transform:scale(1.5) rotate(60deg)}}
.pulse{animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}

  const C=[BX+BL/2,BY+BL/2],TR=[R,T],TL=[Lf,T],BLc=[Lf,Bt],BR=[R,Bt];
  const L=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
  return {20:L(TR,C,1/3),21:L(TR,C,2/3),22:C,23:L(C,BLc,1/3),24:L(C,BLc,2/3),25:L(TL,C,1/3),26:L(TL,C,2/3),27:L(C,BR,1/3),28:L(C,BR,2/3)}[i];

const BIG=new Set([0,5,10,15,22]);
const CELL_NAME={0:'참먹이',5:'모',10:'뒷모',15:'찌모',22:'방'};
function nextCell(c,first,prev,master){
  if(c===OFF)return 1;
  if(c===0)return EXIT;
  if(c===5&&(first||master))return 20;
  if(c===10&&(first||master))return 25;
  if(c>=1&&c<=18)return c+1;
  if(c===19)return 0;
  if(c===20)return 21; if(c===21)return 22;
  if(c===22){if(first)return 27;return prev===26?27:23;}
  if(c===23)return 24; if(c===24)return 15;
  if(c===25)return 26; if(c===26)return 22;
  if(c===27)return 28; if(c===28)return 0;
  return EXIT;
}
function computePath(start,steps,master){
  const path=[];let c=start,prev=null,first=true;
  for(let k=0;k<steps;k++){const n=nextCell(c,first,prev,master);prev=c;c=n;first=false;path.push(c);if(c===EXIT)break;}
  return path;
}
const DIST={};
for(let c=0;c<=28;c++){let x=c,n=0,first=true,prev=null;while(x!==0&&n<40){const y=nextCell(x,first,prev,false);prev=x;x=y;first=false;n++;}DIST[c]=n;}

function prog(pos){return pos===DONE?40:pos===OFF?0:30-DIST[pos];}
function diagEntered(start,path){
  for(let i=0;i<path.length;i++){const c=path[i],pv=i===0?start:path[i-1];
    if((c===20&&pv===5)||(c===25&&pv===10)||(c===27&&pv===22&&i===0))return true;}
  return false;
}

/* ================== 게임 상태 ================== */

const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mkPiece(o){return{id:++PID,owner:o,pos:OFF,hist:[],sc:false};}
function mkPlayer(i,name,isAI,mode){

    pieces:Array.from({length:CORE.PIECES},()=>mkPiece(i)),yeop:0,augs:[],debuff:{curse:0,shackle:false,nap:false},done:false,goals:0,captures:0,missions:0,
    turnCount:0,timeouts:0,bot:false,skin:isAI?SKINS[0].id:profile.skin,

const P=i=>G.players[i];

function has(p,id){return p.augs.some(a=>a.id===id&&!a.disabled);}

const enemy=(a,b)=>a.team!==b.team;
function remaining(p){return p.pieces.filter(x=>x.pos!==DONE).length;}

function piecesAt(c){return G.players.flatMap(p=>p.pieces.filter(x=>x.pos===c));}

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,1600);}
const nm=p=>p.name+(p.isAI?'(AI)':'');

/* 움직일 수 있는 묶음 */
function movers(p){ // 이 플레이어가 움직일 수 있는 말의 주인 목록
  if(G.mode==='team'&&p.done&&has(p,'cheer'))return G.players.filter(q=>q.team===p.team).map(q=>q.i);

}
function groupAt(p,cell){

function movableGroups(p,includeOff=true){
  const own=movers(p),cells=new Set(),out=[];
  own.forEach(o=>P(o).pieces.forEach(x=>{if(x.pos>=0&&x.pos<=28)cells.add(x.pos);}));
  cells.forEach(c=>{const g=groupAt(p,c);if(g.some(x=>own.includes(x.owner)))out.push({key:'c'+c,cell:c,pieces:g});});
  if(includeOff)own.forEach(o=>{const x=P(o).pieces.find(z=>z.pos===OFF);if(x)out.push({key:'off'+o,cell:OFF,pieces:[x]});});

/* ================== 던지기 ================== */
function weights(p,noBack){
  const w=Object.assign({},BASE_W),m=syn(p,'prob',2)?1.5:1;
  const add={probDo:'도',probGae:'개',probGeol:'걸',probYut:'윷',probMo:'모'};
  for(const k in add)if(has(p,k))w[add[k]]+=.05*m;
  if(has(p,'sealBack'))w['빽도']-=.03*m;
  if(p.debuff.curse)w['빽도']+=.15;
  if(syn(p,'prob',3)||noBack)w['빽도']=0;
  let s=0;for(const k in w){w[k]=Math.max(0,w[k]);s+=w[k];}for(const k in w)w[k]/=s;return w;
}
function roll(p,noBack){
  const w=weights(p,noBack);let r=Math.random(),acc=0;
  for(const k of RES){acc+=w[k];if(r<acc)return k;}return '개';
}
function makeChip(p,res,bonus){
  return{res,steps:STEP_OF[res],bonus,id:++PID}; // 칩은 언제나 기본 규칙 칸 수. 복주머니 보정은 이동할 때(2단계) 붙는다
}
function doThrow(forced){
  if(!G)return;const p=cur();if(G.over||G.pending<=0||G.throwing)return;
  if((p.isAI||p.bot)&&aiSpeed<100)return finishThrow(forced);
  if(fxOn()&&YUT3D.ok){
    let res=forced||roll(p,G.noBack),promoted=false;
    if(!forced&&res==='개'&&has(p,'promote')&&Math.random()<.5){res='걸';promoted=true;}
    G.throwing=true;renderSide();
    YUT3D.throwTo(res,()=>{if(!G)return;G.throwing=false;G.justLanded=true;finishThrow(res,promoted);},cur().isAI||cur().bot?650:950);return;}
  G.throwing=true;renderSide();if(fxOn())fxToss();
  setTimeout(()=>{if(!G)return;G.throwing=false;G.justLanded=true;finishThrow(forced);},820);
}
function finishThrow(forced,promoted){
  const p=cur();if(G.over||G.pending<=0)return;
  const bonus=G.ts.throws>0;
  let res=forced||roll(p,G.noBack);
  G.noBack=false;
  if(!forced&&res==='개'&&has(p,'promote')&&Math.random()<.5){res='걸';log(`${nm(p)}: 승급! 개 → 걸`);}
  if(promoted)log(`${nm(p)}: 승급! 개 → 걸`);

  G.pending--;G.ts.throws++;

  p.st.th.push(res);p.st.seen.add(res);

function tidyChips(p){

/* ================== 이동 계산 ================== */
/* ---- 1단계: 기본 규칙만으로 이동 (복주머니 없음). 모든 이동은 여기서 출발한다 ---- */
function coreMove(start,res,hist){
  if(res==='빽도'){
    if(start===OFF)return null;                                   // 규칙 10
    const b=backOne(start,hist);                                  // 규칙 15·16
    return{dest:b.pos,path:[b.pos],newHist:b.hist,back:true,steps:-1};
  }
  const path=computePath(start,CORE.STEPS[res],false);           // 규칙 2·6·7·9
  return{dest:path[path.length-1],path,newHist:hist.concat([start],path.slice(0,-1)),back:false,steps:path.length};
}
/* ---- 2단계: 복주머니·디버프 보정. 1단계 결과에서 파생되며, 기본 규칙의 경계(참먹이 등)를 넘지 못한다 ---- */
function calcMove(p,ch,grp,dir){
  const start=grp.cell,hist=grp.pieces[0].hist;
  // 행운 시너지로 바뀐 결과(도→개)나 분할된 결과는 그 결과를 기본값으로 삼는다
  const baseRes=ch.res;
  const forwardBackdo=baseRes==='빽도'&&dir===1&&has(p,'backdoUse');
  const base=forwardBackdo?coreMove(start,'도',hist):coreMove(start,baseRes,hist);
  if(!base)return null;
  if(base.back){
    const mods=forwardBackdo?['빽도 활용: 앞으로']:[];
    if(start===1&&base.dest===CORE.START_CELL)mods.push('도 자리 빽도 → 참먹이');
    return Object.assign({entered:false,mods,base},base);
  }
  // 보정값 모으기 (기본 칸 수 위에 더하고 뺀다)
  const mods=forwardBackdo?['빽도 활용: 앞으로']:[];let delta=0;
  const add=(n,why)=>{delta+=n;mods.push(`${why} ${n>0?'+':''}${n}`);};
  if(baseRes==='도'&&has(p,'heavyDo'))add(1,'묵직한 도');
  if(start===OFF&&has(p,'startBoost'))add(1,'출발 가속');
  if(start!==OFF&&DIST[start]<=5&&has(p,'finalSprint'))add(1,'막판 스퍼트');
  if(has(p,'comeback')){const rs=G.players.map(remaining),mx=Math.max(...rs),mn=Math.min(...rs);if(remaining(p)===mx&&mx>mn)add(1,'역전의 발판');}
  if(!G.ts.firstMove&&syn(p,'run',3))add(1,'질주 시너지');
  if(G.shackled)add(-1,'족쇄');
  const master=has(p,'shortcutMaster');
  let steps=base.steps+delta;
  if(steps<=0)return{wasted:true,dest:start,path:[],steps,mods,base};
  let path=computePath(start,steps,master),entered=diagEntered(start,path);
  if(master&&!diagEntered(start,base.path)&&entered)mods.push('지름길 달인');
  if(entered&&syn(p,'run',2)){steps++;path=computePath(start,steps,master);entered=diagEntered(start,path);mods.push('지름길 질주 +1');}
  // 기본 규칙 8: 기본 결과로 참먹이를 넘지 못했다면, 보정으로도 넘지 못하고 참먹이에서 멈춘다
  if(CORE.RESULT_MUST_PASS&&path[path.length-1]===EXIT&&base.dest!==EXIT){
    const i0=path.indexOf(CORE.START_CELL);if(i0>=0){path=path.slice(0,i0+1);steps=path.length;mods.push('참먹이에서 멈춤');}
  }
  const dest=path[path.length-1];
  return{dest,path,entered,newHist:hist.concat([start],path.slice(0,-1)),back:false,steps,mods,base};
}
function backSteps(pcs,n){
  for(let k=0;k<n;k++)pcs.forEach(x=>{if(x.pos===OFF||x.pos===DONE)return;const b=backOne(x.pos,x.hist);x.pos=b.pos;x.hist=b.hist;});
}
function sendHome(x){x.pos=OFF;x.hist=[];x.sc=false;}

/* ================== 이동 실행 ================== */
function doMove(chipId,grp,dir){
  const p=cur();const ch=G.chips.find(c=>c.id===chipId);if(!ch)return;
  const mv=calcMove(p,ch,grp,dir);if(!mv)return;
  G.chips=G.chips.filter(c=>c!==ch);G.sel=null;G.pick=null;G.dests=null;G.ts.firstMove=true;
  if(mv.wasted){log(`${nm(p)}: 족쇄 때문에 ${ch.res}이(가) 0칸이 되어 사라짐`);tidyChips(p);after();return;}
  const pcs=grp.pieces;const from=grp.cell;
  if(mv.entered){p.st.scUses++;pcs.forEach(x=>x.sc=true);}
  if(mv.dest===EXIT){
    pcs.forEach(x=>{x.pos=DONE;x.hist=[];P(x.owner).goals++;});
    G.ts.goals+=pcs.length;
    log(`${nm(p)}: 말 ${pcs.length}개 골인!`);
    const sc=pcs.some(x=>x.sc);
    G.players.forEach(q=>{if(!q.done&&remaining(q)===0){q.done=true;G.finishSeq.push(q.i);log(`${nm(q)} 모든 말 골인`);}});
    emit(p,{t:'exit',res:ch.res,count:pcs.length,sc});
  }else{
    pcs.forEach(x=>{x.pos=mv.dest;x.hist=mv.newHist.slice();});
    if(mv.dest===OFF){pcs.forEach(sendHome);log(`${nm(p)}: 빽도로 말이 출발 전으로`);}
    else{
      log(`${nm(p)}: ${ch.res}(${mv.back?'-1':mv.steps}칸${mv.mods&&mv.mods.length?', '+mv.mods.join(', '):''}) → ${CELL_NAME[mv.dest]||(mv.dest+'번 칸')}`);
      landEffects(p,ch,pcs,mv.dest);
    }
  }
  checkEnd();tidyChips(p);after();
}
function landEffects(p,ch,pcs,dest){
  const c=dest;
  // 잡기
  captureAt(p,c,pcs,ch);
  // 긴 팔
  if(has(p,'longArm')&&pcs[0].pos===c){const ahead=nextCell(c,true,null,false);if(ahead!==EXIT&&piecesAt(ahead).some(x=>enemy(P(x.owner),p))){log(`${nm(p)}: 긴 팔!`);captureAt(p,ahead,pcs,ch);}}
  // 함정
  if(pcs[0].pos===c&&G.traps[c]!==undefined&&enemy(P(G.traps[c]),p)){log(`${nm(p)}: 함정에 걸려 2칸 뒤로`);delete G.traps[c];backSteps(pcs,2);}
  const now=pcs[0].pos;if(now<0||now>28)return;
  // 원격 업기
  if(has(p,'remoteStack')){const near=[nextCell(now,true,null,false),pcs[0].hist[pcs[0].hist.length-1]];
    near.forEach(n=>{if(n===undefined||n===EXIT||n===OFF||n===now)return;const g=groupAt(p,n).filter(x=>x.owner===p.i);if(g.length){g.forEach(x=>{x.pos=now;x.hist=pcs[0].hist.slice();});log(`${nm(p)}: 원격 업기`);}});}
  // 같은 칸 묶음 기록 통일
  const grp=groupAt(p,now);grp.forEach(x=>x.hist=pcs[0].hist.slice());
  if([0,5,10,15].includes(now))p.st.corners.add(now);
  const stack=grp.filter(x=>x.owner===p.i).length;
  emit(p,{t:'land',cell:now,stack});
}
function captureAt(p,cell,moverPcs,ch){
  const victims=piecesAt(cell).filter(x=>enemy(P(x.owner),p));if(!victims.length)return;
  const byOwner={};victims.forEach(x=>(byOwner[x.owner]=byOwner[x.owner]||[]).push(x));
  // 현상금 판정용: 상대 판 위 말 중 가장 앞선 진행도
  const oppMax=Math.max(...G.players.filter(q=>enemy(q,p)).flatMap(q=>q.pieces.filter(x=>x.pos>=0&&x.pos<=28).map(x=>prog(x.pos))));
  let caughtAny=false;
  for(const o in byOwner){
    const v=P(+o),vp=byOwner[o];
    if(vp.length>=2&&has(v,'sturdyBack')&&!v.st.sturdyUsed){v.st.sturdyUsed=true;log(`${nm(v)}: 단단한 등으로 버팀`);continue;}
    const tal=augOf(v,'talisman');
    if(tal&&!tal.disabled&&tal.uses>0){log(`${nm(v)}: 부적 발동, 잡힘 무효`);consumeUse(v,tal);continue;}
    const dist=DIST[cell];
    const revengeHit=p.st.rev&&p.turnCount<=p.st.rev.until&&vp.some(x=>p.st.rev.ids.includes(x.id));
    const revengeAug=vp.some(x=>p.st.nemesis.has(x.id));
    const wasTop=vp.some(x=>prog(x.pos)>=oppMax);
    vp.forEach(x=>{
      if(has(v,'refuge')){const h=x.hist;let k=h.length-1;while(k>=0&&![5,10,15].includes(h[k]))k--;
        if(k>=0){x.pos=h[k];x.hist=h.slice(0,k);x.sc=false;}else sendHome(x);}
      else sendHome(x);
    });
    caughtAny=true;
    log(`${nm(p)}이(가) ${nm(v)}의 말 ${vp.length}개를 잡음!`);
    v.st.caughtEver=true;v.st.caughtRound=true;v.st.bounce=v.turnCount+1;
    v.st.rev={ids:moverPcs.map(x=>x.id),until:v.turnCount+1};
    moverPcs.forEach(x=>v.st.nemesis.add(x.id));
    if(syn(v,'guard',2)){v.yeop+=2;}
    if(has(v,'counter')){backSteps(moverPcs,2);log(`${nm(v)}: 반격! 잡은 말이 2칸 뒤로`);}
    if(has(p,'plunder')){const ks=v.augs.filter(a=>!a.disabled);if(ks.length){const a=rnd(ks);a.disabled=true;log(`${nm(p)}: 약탈로 ${nm(v)}의 ${AUG[a.id].name} 1턴 봉인`);}}
    if(has(p,'bounty')&&wasTop){p.yeop+=2;log(`${nm(p)}: 현상금 엽전 2개`);}
    p.captures++;G.ts.catches++;p.st.byV[o]=(p.st.byV[o]||0)+1;
    G.pending+=1+(has(p,'hunter')?1:0)+(has(p,'revenge')&&revengeAug?2:0);G.ts.cb=true;
    if(syn(p,'hunt',2))G.noBack=true;
    emit(p,{t:'capture',res:ch.res,v:o,vCount:vp.length,vDist:dist,moverCount:moverPcs.length,bonus:ch.bonus,revengeHit});
    if(syn(p,'hunt',3))addPieceRandom(p,'사냥 시너지');
  }
  return caughtAny;
}

/* ================== 디버프 / 말 추가 ================== */
function addPieceRandom(src,why){
  const cands=G.players.filter(q=>q!==src&&(G.mode==='team'||!q.done));if(!cands.length)return;
  const t=rnd(cands);
  if(syn(t,'guard',3)&&!t.st.g3Used){t.st.g3Used=true;log(`${why}: ${nm(t)}에게 걸렸지만 수호 시너지로 무효`);return;}
  if(G.mode==='team'){const holder=G.players.find(q=>q.team===t.team&&augOf(q,'charm')&&!augOf(q,'charm').disabled);
    if(holder){log(`${why}: ${nm(t)}에게 걸렸지만 액막이로 무효`);consumeUse(holder,augOf(holder,'charm'));return;}}
  t.pieces.push(mkPiece(t.i));
  log(`${why}: 랜덤으로 ${nm(t)}에게 말 하나 추가!`);toast(`${t.name}에게 말 하나 추가`);
  if(t.done){t.done=false;G.finishSeq=G.finishSeq.filter(i=>i!==t.i);log(`${nm(t)} 다시 판으로 복귀`);}
}
function applyDebuff(src,t,kind){
  const rf=augOf(t,'reflect');
  if(rf&&!rf.disabled&&rf.uses>0){log(`${nm(t)}: 반사! ${kindName(kind)}이(가) ${nm(src)}에게 돌아감`);consumeUse(t,rf);t=src;}
  if(kind==='curse')t.debuff.curse=1;if(kind==='shackle')t.debuff.shackle=true;if(kind==='nap')t.debuff.nap=true;
  log(`${nm(t)}에게 ${kindName(kind)}`);
}
const kindName=k=>({curse:'저주',shackle:'족쇄',nap:'낮잠'}[k]);
function consumeUse(p,a,isShop){
  if(isShop||!a)return;a.uses--;
  if(a.uses<=0){p.augs=p.augs.filter(x=>x!==a);const y=3*(syn(p,'trick',2)?2:1);p.yeop+=y;log(`${nm(p)}: ${AUG[a.id].name} 다 사용 → 엽전 ${y}개`);}
}

/* ================== 미션 ================== */
const MTEST={
 m1:(p,e)=>e.t==='throw'&&p.st.th.slice(-2).join()==='모,모',
 m2:(p,e)=>e.t==='throw'&&G.ts.yut>=2,
 m3:(p,e)=>e.t==='throw'&&p.st.th.slice(-3).join()==='도,도,도',
 m4:(p,e)=>e.t==='throw'&&['도','개','걸','윷','모'].every(r=>p.st.seen.has(r)),
 m5:(p,e)=>e.t==='throw'&&G.ts.throws>=4,
 m6:(p,e)=>e.t==='throw'&&p.st.th.slice(-2).join()==='빽도,빽도',
 m7:(p,e)=>e.t==='exit',
 m8:(p,e)=>e.t==='exit'&&e.sc,
 m9:(p,e)=>e.t==='land'&&e.cell===22,
 m10:(p,e)=>e.t==='land'&&p.st.corners.size>=4,
 m11:(p,e)=>(e.t==='land'||e.t==='exit')&&onBoard(p)>=3,
 m12:(p,e)=>e.t==='exit'&&e.res==='모',
 m13:(p,e)=>e.t==='exit'&&G.ts.goals>=2,
 m14:(p,e)=>(e.t==='land'||e.t==='exit')&&p.st.scUses>=3,
 m15:(p,e)=>{if(e.t!=='land')return false;const a=nextCell(e.cell,true,null,false);return a!==EXIT&&piecesAt(a).some(x=>enemy(P(x.owner),p));},
 m16:(p,e)=>e.t==='capture',
 m17:(p,e)=>e.t==='capture'&&G.ts.catches>=2,
 m18:(p,e)=>e.t==='capture'&&e.res==='빽도',
 m19:(p,e)=>e.t==='capture'&&e.vCount>=2,
 m20:(p,e)=>e.t==='capture'&&p.st.byV[e.v]>=2,
 m21:(p,e)=>e.t==='capture'&&e.revengeHit,
 m22:(p,e)=>e.t==='capture'&&e.vDist<=3,
 m23:(p,e)=>e.t==='land'&&e.stack>=2,
 m24:(p,e)=>e.t==='land'&&e.stack>=3,
 m25:(p,e)=>e.t==='exit'&&e.count>=2,
 m26:(p,e)=>e.t==='capture'&&e.moverCount>=2,
 m27:(p,e)=>e.t==='exit'&&!p.st.caughtEver,
 m28:(p,e)=>e.t==='round'&&p.st.safe>=3,
 m29:(p,e)=>{if(e.t!=='capture')return false;const gs=G.players.map(q=>q.goals);return p.goals===Math.min(...gs)&&Math.max(...gs)>p.goals;},
 m30:(p,e)=>e.t==='throw'&&(e.res==='모'||e.res==='윷')&&p.st.bounce===p.turnCount,
 m31:(p,e)=>(e.t==='throw'||e.t==='capture')&&G.ts.ym&&G.ts.cb,
 m32:(p,e)=>e.t==='capture'&&e.bonus,
};
function emit(p,e){
  G.missions.forEach(m=>{if(m.by!==null)return;let ok=false;try{ok=MTEST[m.id](p,e);}catch(err){ok=false;}
    if(ok){m.by=p.i;p.missions++;p.yeop+=5;log(`★ ${nm(p)} 미션 달성: ${MIS[m.id].name} (엽전 5)`);toast(`${p.name}: 미션 달성!`);
      if(p.i===0&&!p.isAI){profile.misSeen[m.id]={seen:true,done:true};saveProfile();}}});
}

/* ================== 복주머니 ================== */
function acquire(p,id){
  const d=AUG[id];const a={id,uses:d.uses||0,disabled:false,bonusUse:false};
  p.augs.push(a);
  if(d.uses&&syn(p,'trick',3)){p.augs.forEach(x=>{if(AUG[x.id].uses&&!x.bonusUse){x.uses++;x.bonusUse=true;}});}
  if(p.i===0&&!p.isAI){if(!profile.augSeen.includes(id))profile.augSeen.push(id);
    Object.keys(SYN).forEach(t=>{if(syn(p,t,2)&&!profile.synSeen.includes(t))profile.synSeen.push(t);});saveProfile();}
  log(`${nm(p)} 복주머니: ${d.name}`);
}
function candidates(p){
  const pool=AUGS.filter(a=>(a.tag!=='team'||G.mode==='team')&&!p.augs.some(x=>x.id===a.id));
  return shuffle(pool).slice(0,3).map(a=>a.id);
}

/* ================== 차례 진행 ================== */
function startTurn(){
  if(!G||G.over)return;
  const p=cur();
  p.turnCount++;
  G.ts={throws:0,yut:0,catches:0,goals:0,ym:false,cb:false,firstMove:false,luck2:false,luck3:false,usedPre:false};
  G.chips=[];G.pending=0;G.sel=null;G.ui=null;G.pick=null;G.dests=null;G.shackled=false;G.noBack=false;G.lastSticks=null;
  if(p.done&&!(G.mode==='team'&&has(p,'cheer'))){render();return nextTurn(true);}
  if(p.debuff.nap){p.debuff.nap=false;log(`${nm(p)}: 낮잠으로 이번 차례를 쉼`);render();return setTimeout(()=>nextTurn(),aiSpeed);}
  if(p.debuff.shackle){p.debuff.shackle=false;G.shackled=true;log(`${nm(p)}: 족쇄 (이번 차례 이동 -1칸)`);if(p.i===0)toast('족쇄: 이번 차례는 모든 이동이 1칸 줄어듭니다');}
  G.pending=1;
  G.deadline=Date.now()+20000;
  render();
  if(aiSpeed>=100||p.i===0)showBanner(p.i===0?(p.bot?'나의 차례 · 자동':'나의 차례'):`${p.name} 차례`);
  if(p.isAI||p.bot)setTimeout(aiStep,aiSpeed);
}
function after(){
  if(!G)return;
  if(G.over){render();return;}
  if(G.pending<=0&&G.chips.length===0){render();setTimeout(()=>nextTurn(),cur().isAI||cur().bot?aiSpeed*.6:350);return;}
  G.deadline=Date.now()+20000;
  render();
  const p=cur();if((p.isAI||p.bot)&&!G.paused)setTimeout(aiStep,aiSpeed);
}
function nextTurn(skip){
  if(!G||G.over)return;
  const p=cur();
  p.augs.forEach(a=>a.disabled=false); // 약탈 봉인은 자기 차례가 끝나면 풀림
  G.turnPtr=(G.turnPtr+1)%G.order.length;
  if(G.turnPtr===0){G.round++;roundEnd();return;}
  skip?setTimeout(startTurn,60):startTurn();
}
function roundEnd(){
  G.players.forEach(q=>{if(!q.st.caughtRound&&onBoard(q)>=2)q.st.safe++;else q.st.safe=0;q.st.caughtRound=false;emit(q,{t:'round'});});
  if([1,4,7].includes(G.round)){
    G.players.forEach(q=>{if(q.isAI||q.bot)acquire(q,aiPickAug(q,candidates(q)));});
    if(!human().bot){G.paused=true;render();showDraft();return;}
  }
  startTurn();
}
function checkEnd(){
  if(G.over)return;
  let end=false;
  if(G.mode==='team'){end=['A','B'].some(t=>G.players.filter(q=>q.team===t).every(q=>q.done));}
  else end=G.players.some(q=>q.done);
  if(end)finishGame();
}

/* ================== 결과 ================== */
function finishGame(){
  G.over=true;G.paused=true;
  const ps=G.players.slice();
  const fin=G.finishSeq.map(P);
  const rest=ps.filter(q=>!fin.includes(q)).sort((a,b)=>remaining(a)-remaining(b)||b.captures-a.captures);
  const order=[];let rank=0;
  fin.forEach(q=>{rank++;order.push({q,rank});});
  rest.forEach((q,k)=>{const prev=order[order.length-1];
    if(k>0&&prev&&remaining(prev.q)===remaining(q)&&prev.q.captures===q.captures&&!fin.includes(prev.q))order.push({q,rank:prev.rank});
    else order.push({q,rank:order.length+1});});
  const pts=RANKPTS[G.mode];
  order.forEach(o=>{o.rp=pts[o.rank-1]||0;o.gp=o.q.goals*10;o.mp=o.q.missions*30;o.bonus=0;o.score=o.rp+o.gp+o.mp;});
  let teamRes=null;
  if(G.mode==='team'){
    const sum=t=>order.filter(o=>o.q.team===t).reduce((s,o)=>s+o.score,0);
    const a=sum('A'),b=sum('B');teamRes={A:a,B:b};
    order.forEach(o=>{if(a===b)o.bonus=25;else if((a>b&&o.q.team==='A')||(b>a&&o.q.team==='B'))o.bonus=50;o.score+=o.bonus;});
  }
  const me=order.find(o=>o.q.i===0);
  profile.bokdon+=me.score;saveProfile();
  G.result={order,teamRes,earned:me.score};
  render();setTimeout(showResult,500);
}

/* ================== AI ================== */
function aiPickAug(p,c){const pref=['hunter','talisman','teleport','sturdyBack','probMo','startBoost','refuge','teamStack','cheer'];
  return c.find(x=>pref.includes(x))||rnd(c);}
function danger(p,dest){
  if(dest<0||dest>28)return 0;let d=0;
  G.players.forEach(q=>{if(!enemy(q,p))return;
    const cells=new Set(q.pieces.filter(x=>x.pos>=0&&x.pos<=28).map(x=>x.pos));if(q.pieces.some(x=>x.pos===OFF))cells.add(OFF);
    cells.forEach(c=>{for(let s=1;s<=5;s++){const pa=computePath(c,s,false);if(pa[pa.length-1]===dest){d+=s===2||s===3?1.2:.7;break;}}});});
  return d;
}
function scoreMove(p,ch,g,dir){
  const mv=calcMove(p,ch,g,dir);if(!mv)return null;if(mv.wasted)return{s:-20,mv};
  let s=0;const n=g.pieces.length;
  if(mv.dest===EXIT)return{s:80+12*n,mv};
  if(mv.dest===OFF)return{s:-30*n,mv};
  const vics=piecesAt(mv.dest).filter(x=>enemy(P(x.owner),p));
  if(vics.length)s+=40+vics.length*12+vics.reduce((a,x)=>a+prog(x.pos),0);
  if([5,10,22].includes(mv.dest))s+=9;
  s+=(prog(mv.dest)-prog(g.cell))*1.6;
  if(!vics.length)s-=danger(p,mv.dest)*11*n;
  if(G.traps[mv.dest]!==undefined&&enemy(P(G.traps[mv.dest]),p))s-=25;
  if(piecesAt(mv.dest).some(x=>x.owner===p.i))s+=3;
  if(g.cell===OFF&&movableGroups(p,false).length===0)s+=6;
  return{s,mv};
}
function bestAction(p){
  let best=null;
  G.chips.forEach(ch=>movableGroups(p,true).forEach(g=>{
    const dirs=ch.res==='빽도'&&has(p,'backdoUse')?[-1,1]:[0];
    dirs.forEach(dir=>{if(ch.res==='빽도'&&dir!==1&&g.cell===OFF)return;const r=scoreMove(p,ch,g,dir);if(!r)return;
      const v=r.s+(ch.res==='빽도'?0:ch.steps*.1);if(!best||v>best.v)best={v,ch,g,dir};});}));
  return best;
}
function leadingEnemy(p){return G.players.filter(q=>enemy(q,p)&&!q.done).sort((a,b)=>b.pieces.reduce((s,x)=>s+prog(x.pos),0)-a.pieces.reduce((s,x)=>s+prog(x.pos),0))[0];}
function aiPre(p){
  G.ts.usedPre=true;
  const e=leadingEnemy(p);if(!e)return;
  // 상점 (자동 진행 중인 사람은 상점을 쓰지 않음)
  if(p.isAI&&Math.random()<.35){const can=SHOP.filter(it=>it.price<=p.yeop);if(can.length){const it=can.sort((a,b)=>b.price-a.price)[0];p.yeop-=it.price;log(`${nm(p)} 상점: ${it.name}`);aiEffect(p,it.id,true);}}
  p.augs.slice().forEach(a=>{
    if(AUTO_USE.has(a.id)||!AUG[a.id].uses||Math.random()>.5)return;
    if(['curse','shackle','nap','trap','swap','steal','teleport','summon'].includes(a.id))aiEffect(p,a.id,false,a);
  });
}
function aiEffect(p,id,isShop,a){
  const e=leadingEnemy(p);if(!e)return;
  if(id==='addPiece'){addPieceRandom(p,`${nm(p)}의 상점 아이템`);checkEnd();return;}
  if(['curse','shackle','nap'].includes(id)){applyDebuff(p,e,id);consumeUse(p,a,isShop);return;}
  if(id==='trap'){const ep=e.pieces.filter(x=>x.pos>=0&&x.pos<=28).sort((x,y)=>prog(y.pos)-prog(x.pos))[0];
    let c=ep?nextCell(nextCell(ep.pos,true,null,false),false,ep.pos,false):3;
    if(c===EXIT||c<0||piecesAt(c).length||G.traps[c]!==undefined)c=[2,3,7,12,17].find(z=>!piecesAt(z).length&&G.traps[z]===undefined);
    if(c!==undefined){G.traps[c]=p.i;log(`${nm(p)}: 함정 설치`);consumeUse(p,a,isShop);}return;}
  if(id==='swap'){const mine=p.pieces.filter(x=>x.pos>=0&&x.pos<=28).sort((x,y)=>prog(x.pos)-prog(y.pos))[0];
    const theirs=e.pieces.filter(x=>x.pos>=0&&x.pos<=28).sort((x,y)=>prog(y.pos)-prog(x.pos))[0];
    if(mine&&theirs&&prog(theirs.pos)>prog(mine.pos)+4){swapGroups(p,mine.pos,e,theirs.pos);consumeUse(p,a);}return;}
  if(id==='steal'){const v=G.players.find(q=>enemy(q,p)&&q.augs.some(x=>AUG[x.id].uses));if(v){doSteal(p,v);consumeUse(p,a);}return;}
  if(id==='teleport'){const x=p.pieces.filter(z=>z.pos>=0&&z.pos<=28&&DIST[z.pos]>3).sort((m,n)=>prog(m.pos)-prog(n.pos))[0];
    if(x&&!piecesAt(22).some(z=>enemy(P(z.owner),p))){teleportGroup(p,x.pos,22);consumeUse(p,a);}return;}
  if(id==='summon'){const mine=p.pieces.find(z=>z.pos>=0&&z.pos<=28&&z.pos!==0);const theirs=e.pieces.filter(z=>z.pos>=0&&z.pos<=28).sort((m,n)=>prog(n.pos)-prog(m.pos))[0];
    if(mine&&theirs){summonGroup(p,e,theirs.pos,mine.pos);consumeUse(p,a);}return;}
}
function aiStep(){
  if(!G||G.over||G.paused||G.throwing)return;const p=cur();if(!(p.isAI||p.bot))return;
  if(!G.ts.usedPre&&(p.isAI||p.bot)){aiPre(p);render();checkEnd();if(G.over)return;}
  if(G.pending>0){
    const dt=augOf(p,'doubleThrow');
    if(dt&&Math.random()<.3){const r1=roll(p,G.noBack),r2=roll(p,G.noBack);const pick=STEP_OF[r1]>=STEP_OF[r2]?r1:r2;consumeUse(p,dt);log(`${nm(p)}: 두 번 던지기 (${r1}/${r2})`);return doThrow(pick);}
    const yc=augOf(p,'yutControl');if(yc&&Math.random()<.25){consumeUse(p,yc);log(`${nm(p)}: 윷 조작`);return doThrow('윷');}
    return doThrow();
  }
  // 행운 2시너지: 도 → 개
  if(syn(p,'luck',2)&&!G.ts.luck2){const d=G.chips.find(c=>c.res==='도');if(d){d.res='개';d.steps=2;G.ts.luck2=true;log(`${nm(p)}: 행운 시너지로 도 → 개`);}}
  const b=bestAction(p);
  if(!b){G.chips=[];return after();}
  doMove(b.ch.id,b.g,b.dir);
}

/* ================== 사용형 효과 (사람·AI 공통) ================== */
function teleportGroup(p,cell,corner){const g=groupAt(p,cell);const h=g[0].hist.concat([cell]);g.forEach(x=>{x.pos=corner;x.hist=h.slice();});log(`${nm(p)}: 순간이동 → ${CELL_NAME[corner]}`);}
function summonGroup(p,e,ecell,mycell){const dest=nextCell(mycell,true,null,false);if(dest===EXIT)return false;
  const g=piecesAt(ecell).filter(x=>x.owner===e.i);g.forEach(x=>{x.hist=x.hist.concat([ecell]);x.pos=dest;});log(`${nm(p)}: 강제 소환! ${nm(e)}의 말을 ${CELL_NAME[dest]||dest+'번 칸'}으로`);return true;}
function swapGroups(p,mcell,e,ecell){const a=groupAt(p,mcell).filter(x=>x.owner===p.i),b=piecesAt(ecell).filter(x=>x.owner===e.i);
  const ha=a[0].hist.slice(),hb=b[0].hist.slice();a.forEach(x=>{x.pos=ecell;x.hist=hb.slice();});b.forEach(x=>{x.pos=mcell;x.hist=ha.slice();});log(`${nm(p)}: 둔갑술로 ${nm(e)}와 자리를 맞바꿈`);}
function doSteal(p,v){const us=v.augs.filter(x=>AUG[x.id].uses);if(!us.length)return;const a=rnd(us);v.augs=v.augs.filter(x=>x!==a);
  if(p.augs.some(x=>x.id===a.id)){p.yeop+=3;log(`${nm(p)}: 강탈했지만 이미 가진 ${AUG[a.id].name} → 엽전 3개`);}else{p.augs.push(a);log(`${nm(p)}: ${nm(v)}의 ${AUG[a.id].name}을(를) 강탈`);}}

/* ================== 사람 입력 ================== */
// 고른 말에서 갈 수 있는 곳 목록 (모아둔 결과마다 하나, 같은 곳은 하나로 묶음)
function destsFor(p,key){
  const g=movableGroups(p,true).find(x=>x.key===key);if(!g)return[];
  const out=[];
  G.chips.forEach(ch=>{
    const dirs=ch.res==='빽도'?(has(p,'backdoUse')?[-1,1]:[-1]):[0];
    dirs.forEach(dir=>{
      if(dir!==1&&ch.res==='빽도'&&g.cell===OFF)return;
      const mv=calcMove(p,ch,g,dir);if(!mv)return;
      const dest=mv.wasted?g.cell:mv.dest;
      const n=mv.wasted?'0칸':mv.back?'뒤로 1칸':mv.steps+'칸';
      const label=`${ch.res} ${n}`;
      const same=out.find(o=>o.dest===dest);
      if(same){same.labels.push(label);
        if(dest===EXIT&&ch.steps<same.steps){same.chip=ch.id;same.dir=dir;same.steps=ch.steps;same.mods=mv.mods;}return;}
      out.push({dest,chip:ch.id,dir,steps:ch.res==='빽도'?-1:ch.steps,labels:[label],mods:mv.mods||[],wasted:!!mv.wasted});
    });
  });
  return out;
}
function onGroupClick(key){
  if(!isMyTurn()||G.throwing)return;const p=human();
  if(G.ui)return handleUiClick(key);
  if(key.startsWith('d')){const d=(G.dests||[])[+key.slice(1)];const g=movableGroups(p,true).find(x=>x.key===G.pick);
    if(!d||!g)return;G.pick=null;G.dests=null;G.deadline=Date.now()+20000;doMove(d.chip,g,d.dir);return;}
  if(!G.chips.length){toast(G.pending>0?'먼저 윷을 던지세요':'움직일 결과가 없어요');return;}
  if(G.pick===key){G.pick=null;G.dests=null;return render();}
  const ds=destsFor(p,key);if(!ds.length){toast('이 말은 지금 갈 곳이 없어요');return;}
  G.pick=key;G.dests=ds;render();
}
function chooseDir(dir){const d=G.dirAsk;G.dirAsk=null;const g=movableGroups(human(),true).find(x=>x.key===d.key);if(!g)return render();
  if(dir!==1&&g.cell===OFF){toast('대기 말은 뒤로 갈 수 없어요');return render();}doMove(d.chip,g,dir);}
function startUi(mode,data){G.ui={mode,data:data||{}};G.sel=null;G.pick=null;G.dests=null;render();}
function handleUiClick(key){
  const p=human(),ui=G.ui;
  const m=key.match(/^(c|e|cell)(-?\d+)(?:o(\d+))?$/);if(!m)return;
  const cell=+m[2];
  const a=ui.data.aug,shop=ui.data.shop;
  const finish=()=>{if(!shop)consumeUse(p,a);G.ui=null;checkEnd();render();};
  if(ui.mode==='teleport1'&&m[1]==='c'){ui.mode='teleport2';ui.data.from=cell;return render();}
  if(ui.mode==='teleport2'&&m[1]==='cell'){teleportGroup(p,ui.data.from,cell);return finish();}
  if(ui.mode==='summon1'&&m[1]==='e'){ui.mode='summon2';ui.data.ecell=cell;ui.data.eo=+m[3];return render();}
  if(ui.mode==='summon2'&&m[1]==='c'){if(!summonGroup(p,P(ui.data.eo),ui.data.ecell,cell)){toast('참먹이에 있는 말 앞으로는 끌어올 수 없어요');return;}return finish();}
  if(ui.mode==='swap1'&&m[1]==='c'){ui.mode='swap2';ui.data.from=cell;return render();}
  if(ui.mode==='swap2'&&m[1]==='e'){swapGroups(p,ui.data.from,P(+m[3]),cell);return finish();}
  if(ui.mode==='trap'&&m[1]==='cell'){G.traps[cell]=p.i;log(`${nm(p)}: 함정 설치`);return finish();}
}
function useAug(id,isShop){
  const p=human();if(!isMyTurn())return;
  const a=isShop?null:augOf(p,id);
  const data={aug:a,shop:isShop};
  const onB=p.pieces.some(x=>x.pos>=0&&x.pos<=28);
  const enemOn=G.players.some(q=>enemy(q,p)&&q.pieces.some(x=>x.pos>=0&&x.pos<=28));
  if(id==='addPiece'){addPieceRandom(p,'상점 아이템');checkEnd();return render();}
  if(id==='teleport'){if(!onB)return toast('판 위에 내 말이 있어야 해요');return startUi('teleport1',data);}
  if(id==='summon'){if(!onB||!enemOn)return toast('판 위에 내 말과 상대 말이 모두 있어야 해요');return startUi('summon1',data);}

function loadFaces(done){let n=0;const imgs=FACES.map(src=>{const im=new Image();im.onload=()=>{if(++n===FACES.length)done(imgs);};im.src=src;return im;});}
function faceCanvas(imgs){const c=document.createElement('canvas');c.width=TW;c.height=TCH;const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,TW,TCH);
  // 줄 배치: 0 빽도 가락 등(복주머니) · 1 둥근 복주머니 · 2 매화 가지 · 3 둥근 복주머니 좌우 뒤집음 · 4 X 무늬(모든 가락의 납작한 면)
  const row=(im,k,flip)=>{x.save();if(flip){x.translate(TW,0);x.scale(-1,1);}x.drawImage(im,0,k*(TH+TGAP),TW,TH);x.restore();};
  row(imgs[0],0);row(imgs[1],1);row(imgs[3],2);row(imgs[1],3,true);
  // 배: 전통 윷처럼 X 세 개. 획은 시트의 자개 결로 채우고, 둘레에 가는 자개 테
  {const oy=4*(TH+TGAP);const pc=document.createElement('canvas');pc.width=pc.height=200;pc.getContext('2d').drawImage(imgs[0],TW*.4,40,180,150,0,0,200,200);
    const pat=x.createPattern(pc,'repeat');x.save();x.beginPath();x.rect(0,oy,TW,TH);x.clip();x.fillStyle='#050404';x.fillRect(0,oy,TW,TH);
    x.strokeStyle=pat;x.lineCap='round';
    const m=16,rr=TH/2-m;x.lineWidth=5;x.beginPath();x.moveTo(m+rr,oy+m);x.lineTo(TW-m-rr,oy+m);x.arc(TW-m-rr,oy+TH/2,rr,-Math.PI/2,Math.PI/2);x.lineTo(m+rr,oy+TH-m);x.arc(m+rr,oy+TH/2,rr,Math.PI/2,Math.PI*1.5);x.stroke();
    const h=TH*.30,Xs=()=>{[.25,.5,.75].forEach(u=>{const cx=TW*u,cy=oy+TH/2;x.beginPath();x.moveTo(cx-h,cy-h);x.lineTo(cx+h,cy+h);x.moveTo(cx+h,cy-h);x.lineTo(cx-h,cy+h);x.stroke();});};
    x.lineWidth=TH*.09;x.strokeStyle='#d9ddd6';Xs();x.globalAlpha=.55;x.strokeStyle=pat;Xs();x.globalAlpha=1;
    x.restore();}
  return c;}

const VS=`attribute vec3 aP;attribute vec3 aN;attribute vec3 aF;uniform mat4 uM,uVP;uniform mat3 uNM;varying vec3 vP;varying vec3 vN;varying vec3 vO;varying vec3 vON;
void main(){vec4 w=uM*vec4(aP,1.0);vP=w.xyz;vN=uNM*aN;vO=aF;vON=aN;gl_Position=uVP*w;}`;
const ENV=`vec3 env(vec3 d){float top=smoothstep(.45,.95,d.y);
  float b1=smoothstep(.95,.992,dot(d,normalize(vec3(-.55,.75,.35))));float b2=smoothstep(.96,.994,dot(d,normalize(vec3(.7,.55,-.45))));float b3=smoothstep(.975,.997,dot(d,normalize(vec3(.1,.35,.93))));
  float b4=smoothstep(.97,.996,dot(d,normalize(vec3(-.8,.45,-.4))));
  vec3 base=mix(vec3(.004,.008,.01),vec3(.045,.09,.10),smoothstep(-.3,.7,d.y));
  return base+top*vec3(.75,.82,.9)*.9+b1*vec3(1.,.95,.86)*4.2+b2*vec3(.72,.94,1.)*3.6+b3*vec3(1.,.82,.9)*3.0+b4*vec3(.85,1.,.9)*2.6;}`;
const FS=`precision highp float;varying vec3 vP;varying vec3 vN;varying vec3 vO;varying vec3 vON;
uniform vec3 uCam,uTint,uKey;uniform float uIri,uTrans,uRefl,uSpark,uMat,uCut,uInlay,uGloss,uL,uW,uP,uRow,uUseTex,uSide,uGoldX,uTaper;uniform mat3 uNM;uniform sampler2D uTex;${ENV}
float hs(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float vn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(mix(hs(i),hs(i+vec3(1,0,0)),f.x),mix(hs(i+vec3(0,1,0)),hs(i+vec3(1,1,0)),f.x),f.y),mix(mix(hs(i+vec3(0,0,1)),hs(i+vec3(1,0,1)),f.x),mix(hs(i+vec3(0,1,1)),hs(i+vec3(1,1,1)),f.x),f.y),f.z);}
void main(){vec3 N=normalize(vN);
  if(uMat>2.5){ // 옻칠 + 자개 상감 + 금선
    vec3 V0=normalize(uCam-vP);vec3 N0=normalize(vN);float nd=clamp(dot(N0,V0),0.,1.);vec3 R0=reflect(-V0,N0);
    float a=abs(2.*(vO.x/uL+.5)-1.);float scv=pow(max(0.,1.-pow(a,uP)),1./uP);
    vec2 st=uSide>.5?vec2(vO.x/uL+.5,(vO.y-.1)/.8):vec2(vO.x/uL+.5,.5+vO.z/(uW*(1.-uTaper*a*a)*max(scv,.06)));
    vec3 alb=uUseTex>.5?texture2D(uTex,vec2(st.x,(uRow*${TH+TGAP}.+clamp(st.y,0.,1.)*${TH}.)/${TCH}.)).rgb:vec3(.02);
    if(st.y<0.||st.y>1.)alb=vec3(.02);
    alb=pow(alb,vec3(1.15));float lum=dot(alb,vec3(.3,.55,.15));float nm=smoothstep(.12,.5,lum);
    if(uGoldX>.5)alb=mix(alb,lum*vec3(1.35,1.02,.55),nm);
    float Fr=.04+.96*pow(1.-nd,5.);
    float ph=lum*2.2+nd*1.5+dot(R0,vec3(.35,.25,.45))*1.6+sin(vO.x*9.+vO.y*6.+vO.z*14.)*.25;
    vec3 iri=.5+.5*cos(6.2832*(vec3(0.,.33,.67)+ph));
    vec3 c=alb*(.7+.45*nd);
    c=mix(c,c*(.55+.9*iri)+iri*.06,nm*(.25+.75*uInlay)*.8);
    c+=nm*pow(max(dot(R0,normalize(uKey)),0.),30.)*.9*uInlay*mix(vec3(1.),iri,.5);
    float sp=pow(max(dot(R0,normalize(uKey)),0.),520.)*9.+pow(max(dot(R0,normalize(vec3(.6,.7,-.35))),0.),700.)*6.;
    c+=env(R0)*Fr*(.35+.9*uGloss)+sp*uGloss;
    c=c/(1.+c*.32);gl_FragColor=vec4(c,1.);return;}
  if(uMat<.5&&uCut>0.){ // 면 깎임: 등쪽 법선을 12면으로 나눈 방향과 섞음
    vec3 on=normalize(vON);if(on.y<.6){float a=atan(-on.y,on.z);float st=3.14159/12.;float q=(floor(a/st)+.5)*st;vec3 fn=normalize(vec3(on.x,-sin(q),cos(q))*vec3(1.,length(on.yz),length(on.yz))+vec3(on.x,0.,0.));
      N=normalize(mix(N,normalize(uNM*fn),uCut));}}
  vec3 V=normalize(uCam-vP);float ndv=clamp(dot(N,V),0.,1.);vec3 R=reflect(-V,N);
  float F=.08+.92*pow(1.-ndv,3.);
  if(uMat>1.5){vec3 c=uTint*(.45+.75*ndv)+env(R)*F*1.2+pow(max(dot(R,normalize(uKey)),0.),180.)*4.;gl_FragColor=vec4(c/(1.+c*.3),1.);return;}
  if(uMat>.5){vec3 c=vec3(.03)*(.35+.65*ndv)+env(R)*F*.5;gl_FragColor=vec4(c/(1.+c*.3),1.);return;}
  // 자개 결: 길이 방향으로 흐르는 물결 띠 + 잔결
  vec3 q=vO*vec3(2.2,9.,9.);float band=vn(q+vec3(vn(q*.5)*2.,0.,0.));float fine=vn(vO*vec3(14.,40.,40.));float h=band*.75+fine*.25;
  float th=h*1.8+ndv*1.5+dot(R,vec3(.3,.2,.4))*1.1;

function transitionTo(fn){
  const w=document.getElementById('wipe');
  if(!w.dataset.ready){w.style.setProperty('--nacre',`url(${NACRE})`);
    const N='url(#Wn)';let m=`<defs><pattern id="Wn" patternUnits="userSpaceOnUse" width="90" height="90"><image href="${NACRE}" width="90" height="90"/></pattern></defs>`;
    m+=`<circle r="36" fill="#0b0b0e" stroke="${N}" stroke-width="2.6"/><circle r="31" fill="none" stroke="${N}" stroke-width="1"/>`;
    for(let k=0;k<8;k++)m+=`<ellipse cx="0" cy="-15" rx="5" ry="12" transform="rotate(${k*45})" fill="${N}"/>`;
    m+=`<circle r="6.5" fill="#0b0b0e" stroke="${N}" stroke-width="1.4"/><circle r="2.4" fill="${N}"/>`;
    w.querySelector('.medal').innerHTML=m;w.dataset.ready=1;}
  if(transitionTo.busy){fn();return;}transitionTo.busy=true;
  w.hidden=false;w.className='cover';
  setTimeout(()=>{fn();w.className='uncover';
    setTimeout(()=>{w.hidden=true;w.className='';transitionTo.busy=false;},620);},880);
}

   ['미션과 엽전','판마다 미션 5개가 공개됩니다. 먼저 달성하면 엽전 5개. 엽전으로 상점에서 상대 방해 아이템을 살 수 있습니다.'],
  ];
  const [h,d]=T[step];
  modal(`<h2>튜토리얼 ${step+1}/${T.length} · ${h}</h2><p style="font-size:16px;color:var(--ink);max-width:560px">${d}</p>
   <div class="row-btns">${step>0?`<button class="small-btn" data-act="tut" data-s="${step-1}">이전</button>`:''}${step<T.length-1?`<button class="big-btn" data-act="tut" data-s="${step+1}">다음</button>`:`<button class="big-btn" data-act="close">알겠어요</button>`}</div>`);
}

/* ================== 이벤트 ================== */
document.addEventListener('click',e=>{
  const hit=e.target.closest('[data-hit]');if(hit){onGroupClick(hit.dataset.hit);return;}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case'mode':{const m=b.dataset.m;transitionTo(()=>startMatch(m));break;}
    case'fillnow':startMatch.go&&startMatch.go();break;
    case'cancelmatch':clearInterval(matchTimer);transitionTo(renderLobby);break;
    case'tutorial':showTutorial(0);break;
    case'tut':showTutorial(+b.dataset.s);break;
    case'dex':showDex();break;
    case'dextab':showDex(b.dataset.t);break;
    case'skinshop':showSkinShop();break;
    case'buyskin':{const s=SKINS.find(x=>x.id===id);if(profile.bokdon>=s.price){profile.bokdon-=s.price;profile.skins.push(id);profile.skin=id;saveProfile();showSkinShop();renderLobby();}break;}
    case'equip':profile.skin=id;saveProfile();showSkinShop();renderLobby();break;
    case'close':closeModal();break;
    case'drawer':if(G){G.drawer=G.drawer===b.dataset.t?null:b.dataset.t;renderSide();}break;
    case'begin':closeModal();G.paused=false;startTurn();break;
    case'autoOn':{const startModal=!!document.querySelector('#modal:not([hidden]) [data-act=begin]');
      if(startModal){human().bot=true;closeModal();G.paused=false;render();startTurn();toast('자동 진행을 켰어요. 위의 버튼으로 끌 수 있어요');}
      else if(!human().bot)toggleAuto();break;}
    case'draft':acquire(human(),id);closeModal();G.paused=false;startTurn();break;
    case'throw':if(isMyTurn()){G.deadline=Date.now()+20000;doThrow();}break;
    case'chip':selectChip(+id);break;
    case'cancel':G.ui=null;G.dirAsk=null;G.pick=null;G.dests=null;render();break;
    case'dir':chooseDir(+b.dataset.d);break;
    case'shop':if(isMyTurn()&&G.ts.throws===0)showShop();break;
    case'buy':{const it=SHOP.find(x=>x.id===id),me=human();if(me.yeop<it.price)break;me.yeop-=it.price;log(`${nm(me)} 상점: ${it.name}`);closeModal();useAug(id,true);render();break;}
    case'use':useAug(id,false);break;
    case'target':{const t=P(+id),pt=G.pending_target,me=human();closeModal();
      if(pt.kind==='steal')doSteal(me,t);else applyDebuff(me,t,pt.kind);
      if(!pt.data.shop)consumeUse(me,pt.data.aug);render();break;}
    case'force':consumeUse(human(),G.pending_aug);closeModal();log('나: 윷 조작');doThrow(b.dataset.r);break;
    case'force2':consumeUse(human(),G.pending_aug);closeModal();log('나: 두 번 던지기');doThrow(b.dataset.r);break;
    case'luck2':{const c=G.chips.find(x=>x.id===+id);if(c){c.res='개';c.steps=2;G.ts.luck2=true;G.pick=null;G.dests=null;log('나: 행운 시너지로 도 → 개');render();}break;}
    case'luck3':{const c=G.chips.find(x=>x.id===G.lastChipId);if(c){G.chips=G.chips.filter(x=>x!==c);if((c.res==='윷'||c.res==='모')&&G.pending>0)G.pending--;G.pending++;G.ts.luck3=true;G.ts.throws--;log('나: 행운 시너지로 다시 던지기');doThrow();}break;}
    case'split':{const c=G.chips.find(x=>x.id===+id);if(c){const a1={res:'도',steps:1,bonus:c.bonus,id:++PID},a2={res:NAME_OF_STEP[c.steps-1],steps:c.steps-1,bonus:c.bonus,id:++PID};G.chips.splice(G.chips.indexOf(c),1,a1,a2);G.sel=null;G.pick=null;G.dests=null;render();}break;}
    case'result':showResult();break;
    case'lobby':closeModal();YUT3D.ok&&YUT3D.hide();G=null;transitionTo(renderLobby);break;
  }
});
document.getElementById('board').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const h=e.target.closest('[data-hit]');if(h){e.preventDefault();onGroupClick(h.dataset.hit);}}});
document.getElementById('btnRules').onclick=showRules;
addEventListener('keydown',e=>{if(e.key==='Escape'&&G&&G.drawer){G.drawer=null;renderSide();}});
document.getElementById('btnAuto').onclick=toggleAuto;
document.getElementById('btnQuit').onclick=()=>{if(!G)return;modal(`<h2>판에서 나갈까요?</h2><p>판 도중에 나가면 점수는 0점입니다.</p><div class="row-btns"><button class="big-btn" data-act="lobby">나가기</button><button class="small-btn" data-act="close">계속하기</button></div>`);};
document.getElementById('btnSpeed').onclick=e=>{const L=[[650,'보통'],[300,'빠름'],[1100,'느림']];const k=(L.findIndex(x=>x[0]===aiSpeed)+1)%3;aiSpeed=L[k][0];e.target.textContent='AI 속도: '+L[k][1];};

/* 사람 차례 시간 제한 */
setInterval(()=>{
  if(!G||G.over)return;
  const mOpen=!document.getElementById('modal').hidden;
  // 게임 시작 안내: 15초 뒤 자동 시작
  if(mOpen&&G.paused&&document.querySelector('#modal [data-act=begin]')){const left=Math.ceil((G.beginDeadline-Date.now())/1000);const el=document.getElementById('beginLeft');if(el)el.textContent=`${Math.max(0,left)}초 뒤 자동으로 시작합니다`;
    if(left<=0){closeModal();G.paused=false;startTurn();}return;}
  // 복주머니 고르기: 20초 뒤 자동 선택 (자리비움으로 셈)
  if(mOpen&&G.paused&&document.querySelector('#modal [data-act=draft]')){const left=Math.ceil((G.draftDeadline-Date.now())/1000);const el=document.getElementById('draftLeft');if(el)el.textContent=`${Math.max(0,left)}초 안에 고르지 않으면 자동으로 골라집니다`;
    if(left<=0){const me=human();me.timeouts++;acquire(me,aiPickAug(me,G.draftC));closeModal();
      if(me.timeouts>=3&&!me.bot){me.bot=true;toast('자리를 비우신 것 같아 자동 진행을 켰어요. 위의 "자동 진행" 버튼으로 끌 수 있어요');}
      else toast('시간이 지나 복주머니를 자동으로 골랐어요');
      G.paused=false;render();startTurn();}return;}
  if(G.paused||G.throwing)return;
  const p=cur();if(p.i!==0||p.bot)return;
  const bar=document.querySelector('.tbar i');if(bar)bar.style.width=Math.max(0,(G.deadline-Date.now())/200)+'%';
  if(Date.now()>G.deadline){
    if(mOpen)closeModal();
    p.timeouts++;log(`시간 초과 (${p.timeouts}/3) — 자동 진행`);G.ui=null;G.dirAsk=null;G.pick=null;G.dests=null;
    if(p.timeouts>=3){p.bot=true;log('시간 초과 3번: 자동 진행으로 바뀜');toast('자리를 비우신 것 같아 자동 진행을 켰어요. 위의 "자동 진행" 버튼으로 끌 수 있어요');}
    G.deadline=Date.now()+20000;
    if(G.pending>0)doThrow();else{const b=bestAction(p);if(b)doMove(b.ch.id,b.g,b.dir);else{G.chips=[];after();}}
  }
},250);

/* 화면 맞춤 */
function fit(){
  // 컴퓨터: 창 비율 그대로 채움 (세로로 긴 창이면 위아래 배치) / 모바일: 가로 고정, 세로면 돌려달라는 안내
  const W=innerWidth,H=innerHeight,st=document.getElementById('stage');
  const coarse=matchMedia('(pointer:coarse)').matches;
  const port=!coarse&&H>W*1.05;
  const bw=port?720:1280,bh=port?1180:720;
  const s=Math.min(W/bw,H/bh),sw=W/s,sh=H/s;
  st.style.width=sw+'px';st.style.height=sh+'px';st.style.transform=`scale(${s})`;
  st.className=port?'port':'land';
  const dh=port?220:132,btop=port?64:18;
  const bs=Math.max(240,port?Math.min(sw-40,sh-dh-btop-40):Math.min(sh-dh-btop-28,sw-40));
  st.style.setProperty('--bs',bs+'px');st.style.setProperty('--dh',dh+'px');st.style.setProperty('--btop',btop+'px');
  JB.fitScale=s;JB.css=bs;if(typeof jagaeResize==='function')jagaeResize();
}
addEventListener('resize',fit);fit();
/* 배경: 어둠 속에 자개 가루가 천천히 떠다니며 반짝임 */
(function(){const cv=document.getElementById('ambient'),x=cv.getContext('2d');let W=0,H=0,D=1;
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const N=46,F=[];for(let i=0;i<N;i++)F.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*2.2,vx:(Math.random()-.5)*.004,vy:-.002-Math.random()*.006,h:[170,190,210,290,330,40][i%6],ph:Math.random()*6.28,sp:.4+Math.random()*1.2,rot:Math.random()*3.14});
  function size(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;}
  size();addEventListener('resize',size);let last=0;
  function tick(t){requestAnimationFrame(tick);if(t-last<33)return;const dt=Math.min(.1,(t-last)/1000)||.03;last=t;
    x.setTransform(D,0,0,D,0,0);x.clearRect(0,0,W,H);
    for(const f of F){if(!still){f.x+=f.vx*dt*6;f.y+=f.vy*dt*6;if(f.y<-.05){f.y=1.05;f.x=Math.random();}if(f.x<-.05)f.x=1.05;if(f.x>1.05)f.x=-.05;}
      const tw=.35+.65*Math.max(0,Math.sin(t/1000*f.sp+f.ph));const px=f.x*W,py=f.y*H,hue=f.h+Math.sin(t/3000+f.ph)*25;
      x.save();x.translate(px,py);x.rotate(f.rot+t/9000);x.globalAlpha=.18+.5*tw*tw;
      const g=x.createRadialGradient(0,0,0,0,0,f.r*4);g.addColorStop(0,`hsla(${hue},70%,88%,.9)`);g.addColorStop(1,`hsla(${hue},70%,70%,0)`);
      x.fillStyle=g;x.beginPath();x.ellipse(0,0,f.r*4,f.r*2.2,0,0,Math.PI*2);x.fill();
      if(tw>.92){x.globalAlpha=(tw-.92)*8;x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=.6;x.beginPath();x.moveTo(-f.r*5,0);x.lineTo(f.r*5,0);x.moveTo(0,-f.r*5);x.lineTo(0,f.r*5);x.stroke();}
      x.restore();}
  }
  requestAnimationFrame(tick);})();
renderLobby();
</script>
